pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'RTX-Remix-for-Minecraft'
include 'rtx-remix-minecraft', 'rtxremix-java', 'remix-horizons'
include 'remix-horizons:core', 'remix-horizons:fabric'
