plugins { id 'base' }
subprojects {
    group = 'com.gbwater.rtxremix'
    version = '0.2.0-26.3'
}
tasks.named('build') { dependsOn ':remix-horizons:core:build', ':remix-horizons:fabric:build' }
tasks.register('test') { dependsOn ':remix-horizons:core:test', ':remix-horizons:fabric:test' }

tasks.named('check') { dependsOn ':remix-horizons:core:check', ':remix-horizons:fabric:check' }
