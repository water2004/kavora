plugins { id 'base' }

tasks.named('build') {
    dependsOn ':rtx-remix-minecraft:build', ':rtxremix-java:build', ':remix-horizons:build'
}
tasks.named('check') {
    dependsOn ':rtx-remix-minecraft:check', ':rtxremix-java:check', ':remix-horizons:check'
}
tasks.register('test') {
    group = 'verification'
    dependsOn ':rtx-remix-minecraft:test', ':remix-horizons:test'
}
tasks.register('package') {
    group = 'build'
    description = 'Packages the Minecraft mod and the optional Remix Horizons add-on.'
    dependsOn ':rtx-remix-minecraft:verifyPackageJar', ':remix-horizons:fabric:verifyRemixArtifact'
}
tasks.register('release', Copy) {
    group = 'distribution'
    description = 'Copies the verified installable JARs to dist/.'
    dependsOn 'package', ':rtx-remix-minecraft:sourcesJar', ':rtxremix-java:sourcesJar',
            ':rtxremix-java:jar', ':remix-horizons:fabric:sourcesJar'
    from project(':rtx-remix-minecraft').layout.buildDirectory.file('distributions/RTX-Remix.jar')
    from project(':remix-horizons:fabric').layout.buildDirectory.file('libs/Remix-Horizons.jar')
    from({ project(':rtx-remix-minecraft').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { 'RTX-Remix-sources.jar' } }
    from({ project(':rtxremix-java').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { 'rtxremix-java-sources.jar' } }
    from({ project(':rtxremix-java').tasks.named('jar').get().archiveFile.get().asFile }) { rename { 'rtxremix-java.jar' } }
    from({ project(':remix-horizons:fabric').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { 'Remix-Horizons-sources.jar' } }
    into layout.projectDirectory.dir('dist')
    doLast {
        def digests = fileTree('dist').matching { include '*.jar' }.files.sort { it.name }.collect { archive ->
            def sha = java.security.MessageDigest.getInstance('SHA-256')
            archive.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                for (int n; (n = input.read(buffer)) > 0;) sha.update(buffer, 0, n)
            }
            "${sha.digest().encodeHex()}  ${archive.name}"
        }
        file('dist/SHA256SUMS.txt').text = digests.join('\n') + '\n'
    }
}
