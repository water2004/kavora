plugins { id 'base' }

allprojects {
    group = providers.gradleProperty('maven_group').get()
    version = providers.gradleProperty('mod_version').get()
}

tasks.named('build') {
    dependsOn ':kavora:build', ':kavora-sdk:build', ':kavora-horizon:build'
}
tasks.named('check') {
    dependsOn ':kavora:check', ':kavora-sdk:check', ':kavora-horizon:check'
}
tasks.register('test') {
    group = 'verification'
    dependsOn ':kavora:test', ':kavora-horizon:test'
}
tasks.register('package') {
    group = 'build'
    description = 'Packages the Minecraft mod and the optional Kavora Horizon add-on.'
    dependsOn ':kavora:verifyPackageJar', ':kavora-horizon:fabric:verifyAddonArtifact'
}
tasks.register('release', Sync) {
    group = 'distribution'
    description = 'Copies the verified installable JARs to dist/.'
    dependsOn 'package', ':kavora:sourcesJar', ':kavora-sdk:sourcesJar',
            ':kavora-sdk:jar', ':kavora-horizon:fabric:sourcesJar'
    def versionSuffix = "-${project.version}"
    from({ project(':kavora').tasks.named('packageJar').get().archiveFile.get().asFile }) { rename { "Kavora${versionSuffix}.jar" } }
    from({ project(':kavora-horizon:fabric').tasks.named('jar').get().archiveFile.get().asFile }) { rename { "Kavora-horizon${versionSuffix}.jar" } }
    from({ project(':kavora').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { "Kavora-sources${versionSuffix}.jar" } }
    from({ project(':kavora-sdk').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { "Kavora-sdk-sources${versionSuffix}.jar" } }
    from({ project(':kavora-sdk').tasks.named('jar').get().archiveFile.get().asFile }) { rename { "Kavora-sdk${versionSuffix}.jar" } }
    from({ project(':kavora-horizon:fabric').tasks.named('sourcesJar').get().archiveFile.get().asFile }) { rename { "Kavora-horizon-sources${versionSuffix}.jar" } }
    into layout.projectDirectory.dir('dist')
    doLast {
        def digests = fileTree('dist').matching { include '*.jar' }.files.sort { it.name }.collect { archive ->
            def sha = java.security.MessageDigest.getInstance('SHA-256')
            archive.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                for (int n; (n = input.read(buffer)) > 0;) sha.update(buffer, 0, n)
            }
            "${sha.digest().encodeHex()}  ${archive.name}"
        }
        file('dist/SHA256SUMS.txt').text = digests.join('\n') + '\n'
    }
}
