plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'java'
}

evaluationDependsOn(':kavora-sdk')

version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('maven_group').get()

def gitShortHash = providers.exec { commandLine 'git', 'rev-parse', '--short=7', 'HEAD' }
        .standardOutput.asText.map { it.trim() }
// --- Build target architectures ------------------------------------------
// Windows x64 is the release target. -Parch=arm64 is reserved for source-port work;
// an ARM64 build needs a matching runtime staged separately.
def archProperty = project.findProperty('arch')
if (archProperty && !(archProperty in ['win64', 'arm64'])) {
    throw new GradleException(
        "Invalid -Parch value: '${archProperty}'. Use win64 (default) or arm64.")
}
def buildArches = [archProperty ?: 'win64']
logger.lifecycle("Build target: ${buildArches.first()}")

def resolvedBuildVersion = version.toString()

def benchmarkJfrPath = providers.gradleProperty("benchmarkJfrPath")
def benchmarkQuickPlayWorld = providers.gradleProperty("benchmarkQuickPlayWorld")
def clientRunDirectory = providers.gradleProperty('clientRunDir').orElse('run')
def gameTestRunDirectory = providers.gradleProperty('gameTestRunDir').orElse('build/run/clientGameTest')
def gameTestFarTerrainJar = providers.gradleProperty('gameTestFarTerrainJar')
def benchmarkTracyJavaMaxDepth = providers.gradleProperty("benchmarkTracyJavaMaxDepth").orElse("6")
def benchmarkJfrThrowables = providers.gradleProperty("benchmarkJfrThrowables")
        .orElse(providers.environmentVariable("KAVORA_BENCHMARK_JFR_THROWABLES"))
        .orElse("false")

// Shared exclusion rules for both setupRuntime and packageJar.
//   - Strip dxvk PDBs (~100MB), keep kavora-support.pdb (small, useful for debugging)
//   - Drop NvRemixBridge.exe / .pdb (32-bit game bridge, unused in MC Java;
//     avoids naming confusion with kavora-support.dll, the FFM crash helper)
ext.sdkExclusions = { details ->
    def name = details.name
    if (name == '.local-sdk-source' || name.endsWith('.lib') || name.endsWith('.exp')) return true
    if (name == 'NvRemixBridge.exe' || name == 'NvRemixBridge.pdb') return true
    if (name.endsWith('.pdb') && name != 'kavora-support.pdb') return true
    return false
}

base {
    archivesName = 'kavora'
}
def projectArchiveName = base.archivesName.get()

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// Minecraft 26.3 requires Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

loom {
    accessWidenerPath = file("src/main/resources/kavora.accesswidener")

    runs {
        client {
            // Keep these defaults aligned with packaging/launcher-defaults.json.
            // Shared launcher defaults for supported Windows architectures:
            // version metadata supplies HeapDumpPath; the profile supplies G1.
            vmArgs "-Xmx2G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC",
                   "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20",
                   "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M",
                   "-XX:HeapDumpPath=MojangTricksIntelDriversForPerformance_javaw.exe_minecraft.exe.heapdump",
                   "--enable-native-access=ALL-UNNAMED"
            if (benchmarkJfrPath.isPresent()) {
                def jfrPath = benchmarkJfrPath.get().replace('\\', '/')
                // maxsize=0 lifts JDK 21's 250 MB default disk cap so a long
                // recording keeps its earliest frames.
                def jfrRecording = "name=kavora-benchmark,settings=profile,disk=true,dumponexit=false,maxsize=0"
                if (benchmarkJfrThrowables.get().toBoolean()) {
                    jfrRecording += ",jdk.JavaExceptionThrow#enabled=true,jdk.JavaExceptionThrow#stackTrace=true"
                    jfrRecording += ",jdk.JavaErrorThrow#enabled=true,jdk.JavaErrorThrow#stackTrace=true"
                }
                vmArgs "-Dkavora.benchmark.jfrPath=${jfrPath}",
                       "-Dkavora.profile.javaPhases=true",
                       "-Dkavora.profile.tracyJavaMaxDepth=${benchmarkTracyJavaMaxDepth.get()}",
                       "-XX:FlightRecorderOptions=stackdepth=256",
                       "-XX:StartFlightRecording=${jfrRecording}"
            }
            if (benchmarkQuickPlayWorld.isPresent()) {
                programArgs "--quickPlaySingleplayer", benchmarkQuickPlayWorld.get()
            }
            // Optional --username passthrough for runClient.
            if (project.hasProperty('mcUsername')) {
                programArgs "--username", project.property('mcUsername')
            }
            // Set Remix's graphics preset for this runClient launch only:
            // `gradlew runClient -PrtxPreset=high`.
            if (project.hasProperty('rtxPreset')) {
                vmArgs "-Dkavora.preset=${project.property('rtxPreset')}"
            }
            // Join a multiplayer server directly on launch (debugging aid):
            // `gradlew runClient -PmcQuickPlayServer=localhost:25565`
            if (project.hasProperty('mcQuickPlayServer')) {
                programArgs "--quickPlayMultiplayer", project.property('mcQuickPlayServer')
            }
            runDir clientRunDirectory.get()
        }
    }
}

// Sodium and Fabric API are external mods, never bundled into the release JAR.
def fabricApiCoordinate = "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
def sodiumCoordinate = 'maven.modrinth:sodium:mc26.3-0.9.2-fabric'

// Loom inherits the normal client's tuning, while keeping test saves and options isolated.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'kavora-client-tests'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}
loom.runs.clientGameTest {
    runDir gameTestRunDirectory.get()
    // Start at the fixture size so Fabric's end-of-test reset does not resize a live swapchain.
    def testWidth = System.getProperty('kavora.gametest.width')
    if (testWidth != null) {
        programArgs '--width', testWidth, '--height', System.getProperty('kavora.gametest.height', '2160')
    }
    System.properties.findAll { key, value -> key.toString().startsWith('kavora.gametest.') }
            .each { key, value -> vmArgs "-D${key}=${value}" }
    if (project.hasProperty('gameTestExpectedBackend')) {
        vmArgs "-Dkavora.gametest.expectedBackend=${project.property('gameTestExpectedBackend')}"
    }
}

dependencies {
    // Minecraft and Fabric
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"

    implementation fabricApiCoordinate
    // Minecraft supplies the matching LWJGL Vulkan native libraries.
    // Sodium supplies terrain optimization and the shared video settings UI.
    implementation(sodiumCoordinate) { transitive = false }

    implementation project(':kavora-sdk')

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Pin the per-frame install cap so tests don't depend on the CPU count
    systemProperty 'kavora.chunk.maxInstalledColumnsPerFrame', '8'
}

def gitBranch = providers.exec { commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD' }
        .standardOutput.asText.map { it.trim() }

processResources {
    from(rootProject.file('design/Kavora_256.png')) {
        into 'assets/kavora'
        rename { 'icon.png' }
    }
    // Repository-only asset notes contain relative links, not runtime resources.
    exclude 'README.md'
    inputs.property "version", resolvedBuildVersion
    inputs.property "gitShortHash", gitShortHash
    inputs.property "gitBranch", gitBranch

    filesMatching("fabric.mod.json") {
        expand "version": resolvedBuildVersion
    }
    filesMatching("benchmark.properties") {
        expand "gitCommit": gitShortHash.get(), "gitBranch": gitBranch.get()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

def sceneStagesFile = layout.projectDirectory.file('src/main/effects/scene-stages.txt')
def sceneStagesSources = layout.buildDirectory.dir('generated/sources/scene-stages')
def generateSceneStages = tasks.register('generateSceneStages') {
    inputs.file(sceneStagesFile)
    outputs.dir(sceneStagesSources)
    doLast {
        def stages = new LinkedHashMap()
        def calls = new LinkedHashMap()
        def generatedPackage = 'org.edtp.kavora'
        def identifier = /[A-Za-z_$][A-Za-z0-9_$]*/
        def primitive = ['boolean', 'byte', 'char', 'double', 'float', 'int', 'long', 'short'] as Set
        sceneStagesFile.asFile.eachLine('UTF-8') { line, number ->
            def commentStart = line.indexOf('#')
            def declaration = (commentStart < 0 ? line : line.substring(0, commentStart)).trim()
            if (!declaration.isEmpty()) {
                def parts = declaration.split(/\s+/)
                if (parts[0] == 'stage') {
                    if (parts.length < 2 || !(parts[1] ==~ identifier) || stages.containsKey(parts[1])) {
                        throw new GradleException("Invalid scene stage declaration at line ${number}: ${declaration}")
                    }
                    def inputs = []
                    parts.drop(2).each { input ->
                        def match = input =~ /^(${identifier}):(${identifier}(?:\.${identifier})*)$/
                        if (!match.matches()) {
                            throw new GradleException("Invalid typed scene input at line ${number}: ${input}")
                        }
                        def name = match[0][1]
                        def type = match[0][2]
                        if (inputs.any { it.name == name } || !(type in primitive) && !type.contains('.')) {
                            throw new GradleException("Invalid or duplicate scene input at line ${number}: ${input}")
                        }
                        inputs.add([name: name, type: type])
                    }
                    stages[parts[1]] = inputs
                    calls[parts[1]] = []
                } else if (parts[0] == 'call') {
                    if (parts.length < 3 || !stages.containsKey(parts[1])) {
                        throw new GradleException("Invalid scene call at line ${number}: ${declaration}")
                    }
                    def target = parts[2]
                    def arguments = parts.toList().drop(3)
                    def declaredNames = stages[parts[1]].collect { it.name }
                    def targetParts = target.split(/\./)
                    def receiverName = declaredNames.contains(targetParts[0])
                    def instanceCall = targetParts.length == 2 && receiverName &&
                            targetParts.every { it ==~ identifier }
                    def staticCall = targetParts.length >= 3 && !receiverName && targetParts.every { it ==~ identifier }
                    def duplicate = calls[parts[1]].any { it.target == target && it.arguments == arguments }
                    if ((!instanceCall && !staticCall) || arguments.any { !(it ==~ identifier) || !declaredNames.contains(it) } ||
                            arguments.toSet().size() != arguments.size() || duplicate) {
                        throw new GradleException("Invalid scene call target or inputs at line ${number}: ${declaration}")
                    }
                    calls[parts[1]].add([target: target, arguments: arguments])
                } else {
                    throw new GradleException("Unknown scene stage directive at line ${number}: ${declaration}")
                }
            }
        }
        def methods = stages.collect { stage, inputs ->
            def stageCalls = calls[stage]
            def invocations = stageCalls.collect { call ->
                "        ${call.target}(${call.arguments.join(', ')});"
            }.join('\n')
            def args = inputs.collect { input -> "${input.type.contains('.') ? input.type.tokenize('.').last() : input.type} ${input.name}" }
            def signature = args.join(', ')
            """    static void ${stage}(${signature}) {
${invocations}
    }"""
        }.join('\n\n')
        def output = sceneStagesSources.get().file('org/edtp/kavora/SceneEffectSchedule.java').asFile
        output.parentFile.mkdirs()
        def importedTypes = stages.values().flatten().collect { it.type }
                .findAll { it.contains('.') && it.substring(0, it.lastIndexOf('.')) != generatedPackage }.unique().sort()
        def imports = importedTypes.collect { "import ${it};" }.join('\n')
        output.setText("""/*
 * SPDX-FileCopyrightText: Copyright (c) 2026 Kavora contributors.
 * SPDX-License-Identifier: Apache-2.0
 * Generated by generateSceneStages from scene-stages.txt.
 */
package org.edtp.kavora;

${imports}

final class SceneEffectSchedule {
    private SceneEffectSchedule() {}

${methods}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(files(sceneStagesSources).builtBy(generateSceneStages))

def runtimeArch = buildArches.first()
def runtimeSdkDir = "runtime/${runtimeArch}"
def runtimeSupportDir = "../kavora-sdk/build/native/${runtimeArch}"

// Fetch only the runtime consumed by each task. Existing directories, especially
// local snapshots, belong to the developer; Gradle never replaces or updates them.
// Runtime binaries must come from the source-built Vulkan fork. The published
// 0.x packages expose a different ABI and must never be fetched as a fallback.
def validateRuntimeSdk = { File directory, String arch ->
    def metadata = new File(directory, '.runtime-provenance.json')
    def dll = new File(directory, 'd3d9.dll')
    if (!dll.isFile() || !metadata.isFile()) {
        throw new GradleException("Source-built Remix 1.5.0 (${arch}) is missing at ${directory}. " +
                "Build the kavora-runtime/ sources and stage its output with " +
                ".\\tools\\kavora.bat sdk local --arch ${arch} --path <runtime output>. " +
                "The output must include .runtime-provenance.json; 0.x SDK packages are incompatible.")
    }
    def provenance = new groovy.json.JsonSlurper().parse(metadata)
    if (provenance.fork != 'water2004/dxvk-remix' || provenance.apiVersion != '1.5.0' ||
            provenance.architecture != arch || !(provenance.sourceCommit ==~ /[0-9a-f]{40}/) ||
            !(provenance.sourceDirty instanceof Boolean)) {
        throw new GradleException("Runtime provenance does not identify the required source-built ${arch} Remix 1.5.0: ${metadata}")
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    dll.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        for (int n; (n = stream.read(buffer)) > 0;) digest.update(buffer, 0, n)
    }
    if (provenance.dllSha256 != digest.digest().encodeHex().toString()) {
        throw new GradleException("Runtime d3d9.dll differs from its source build provenance: ${directory}. Rebuild and restage the runtime.")
    }
}

def fetchRuntimeSdkTasks = ['win64', 'arm64'].collectEntries { arch ->
    def targetDir = file("runtime/${arch}")
    def fetchTask = tasks.register(arch == 'win64' ? 'fetchRuntimeSdkWin64' : 'fetchRuntimeSdkArm64') {
        description = "Validates the source-built ${arch} Vulkan runtime and ABI provenance"
        group = 'build'
        doLast { validateRuntimeSdk(targetDir, arch) }
    }
    [(arch): fetchTask]
}

// Dev run/ keeps full SDK contents including PDBs so debugger sessions against
// a locally-built (possibly debug-flavor) dxvk can resolve symbols. packageJar
// still strips SDK PDBs for distribution. Support-helper copies inside the SDK directory
// stay excluded so the freshly-built build/native/{arch} copy wins.
def syncRuntimeSdkTask = tasks.register('syncRuntimeSdk', Sync) {
    dependsOn fetchRuntimeSdkTasks[runtimeArch]
    dependsOn runtimeArch == "arm64" ? 'compileNativeArm64' : 'compileNativeWin64'
    doFirst {
        // Sync treats a missing `from` dir as empty and would silently strip
        // run/kavora-runtime down to just the support DLL. Fail with the fix instead.
        if (!file(runtimeSdkDir).directory) {
            throw new GradleException(
                "Remix SDK directory '${runtimeSdkDir}' is missing. To use a local runtime override:\n" +
                "  .\\tools\\kavora.bat sdk local --arch ${runtimeArch} --path <dir>\n" +
                "docs/GETTING_STARTED.md#get-a-runtime describes local staging.")
        }
    }
    from(runtimeSdkDir) {
        exclude 'kavora-support.dll', 'kavora-support.pdb', 'remixbridge.dll', 'remixbridge.pdb'
    }
    from(runtimeSupportDir) {
        include 'kavora-support.dll', 'kavora-support.pdb'
    }
    into 'run/kavora-runtime'
}

// A plain task rather than Copy: a Copy into 'run' declares the whole run directory as
// its output, so Gradle fingerprinted every file under it (saves, logs, the runtime's
// open session files) on each build, and a file a still-exiting client held open
// failed the build with "Failed to create MD5 hash".
def copyRuntimeConfigTask = tasks.register('copyRuntimeConfig') {
    def source = file('packaging/rtx.conf')
    def target = file('run/rtx.conf')
    inputs.file(source)
    outputs.file(target)
    doLast {
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(source.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// Runtime DDS assets are loaded from MinecraftClient.runDirectory; stage them
// for runClient so development uses the production texture paths. They live
// in Packman, not git: runtime/textures/ is the junction packman creates
// from packman/textures.packman.xml, and a pull at the pinned version is a
// local no-op once the package is in the shared cache. Like the runtime
// junctions beside it, it sits where git has never tracked a file, so no
// checkout can write or delete through it into the cache.
def runtimeTexturesDir = 'runtime/textures'
// Packman and repository-owned textures are staged together into <gameDir>/textures/.
// NativeExtractor installs these textures from the distributable JAR.
def runtimeTextureFiles = ['overcast_thunderstorm_bc6u.dds', 'water_normals_flipbook.dds']
def ownedRuntimeTexturesDir = 'packaging/runtime-textures'
def ownedRuntimeTextureFiles = ['milky_way.dds']
def fetchRuntimeTexturesTask = tasks.register('fetchRuntimeTextures', Exec) {
    description = 'Pulls the runtime textures pinned in packman/textures.packman.xml'
    group = 'build setup'
    def manifest = file('packman/textures.packman.xml')
    inputs.file(manifest)
    // A relative script path from its own folder: cmd /c strips the outer
    // quotes of a quoted script path, which splits a checkout path containing
    // spaces, and cmd skips the current folder for a bare name when
    // NoDefaultCurrentDirectoryInExePath is set.
    workingDir file('packman')
    commandLine 'cmd', '/d', '/c', '.\\packman.cmd', 'pull', manifest.absolutePath
    def legacyLink = file('packaging/textures').toPath()
    def texturesDir = file(runtimeTexturesDir)
    doFirst {
        // Earlier builds linked packaging/textures/, which older commits track,
        // so checking one out wrote and deleted files in the shared cache.
        // Remove that junction, which never touches its target; leave a real
        // directory alone.
        def noFollow = java.nio.file.LinkOption.NOFOLLOW_LINKS
        if (java.nio.file.Files.exists(legacyLink, noFollow)
                && java.nio.file.Files.readAttributes(legacyLink,
                        java.nio.file.attribute.BasicFileAttributes, noFollow).isOther()) {
            java.nio.file.Files.delete(legacyLink)
            logger.lifecycle('Removed the old runtime-textures junction at packaging/textures')
        }
    }
    doLast {
        // Packman trusts its install marker, so a cache entry that has lost its
        // files still pulls cleanly.
        def missing = runtimeTextureFiles.findAll { name ->
            def texture = new File(texturesDir, name)
            !texture.isFile() || texture.length() == 0
        }
        if (!missing.isEmpty()) {
            def cache = texturesDir.exists() ? texturesDir.toPath().toRealPath().toString() : texturesDir.path
            throw new GradleException("The runtime textures at ${cache} are missing ${missing.join(', ')}. " +
                    'Delete that folder and build again, and Packman downloads the package afresh.')
        }
    }
}

def verifyOwnedRuntimeTexturesTask = tasks.register('verifyOwnedRuntimeTextures') {
    inputs.files(ownedRuntimeTextureFiles.collect { file("${ownedRuntimeTexturesDir}/${it}") })
    doLast {
        ownedRuntimeTextureFiles.each { name ->
            def texture = file("${ownedRuntimeTexturesDir}/${name}")
            if (!texture.isFile() || texture.length() == 0) {
                throw new GradleException("Missing or empty runtime texture: ${texture}")
            }
        }
    }
}

def syncRuntimeTexturesTask = tasks.register('syncRuntimeTextures', Sync) {
    dependsOn fetchRuntimeTexturesTask, verifyOwnedRuntimeTexturesTask
    from runtimeTexturesDir
    from(ownedRuntimeTexturesDir) { include ownedRuntimeTextureFiles }
    into 'run/textures'
}

def migrateDevelopmentResourcePacksTask = tasks.register('migrateDevelopmentResourcePacks', Exec) {
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('packaging/migrate_resource_packs.ps1').absolutePath,
            '-McDir', file('run').absolutePath, '-LegacyPackName', 'rtx-remix'
}

// The mod acquires its conf option-layers from
// <gameDir>/rtx-remix/mods/minecraft-logic/confs/ at runtime; sync the conf
// payload there for dev runs. The runtime also writes logs/ and captures/
// under run/rtx-remix, and the Toolkit may save other mods under mods/;
// preserve those, but keep our payload dir fully Sync-owned so stale files
// never linger.
def syncRuntimeRemixModsTask = tasks.register('syncRuntimeRemixMods', Sync) {
    from 'packaging/rtx-remix'
    into 'run/rtx-remix'
    preserve {
        include 'logs/**'
        include 'captures/**'
        include 'mods/**'
        exclude 'mods/minecraft-logic/**'
    }
}

tasks.register('setupRuntime') {
    description = 'Syncs SDK, configs, textures, and Remix mods into run/ for local dev'
    group = 'build'
    dependsOn syncRuntimeSdkTask, copyRuntimeConfigTask, syncRuntimeTexturesTask,
            syncRuntimeRemixModsTask, migrateDevelopmentResourcePacksTask
}

tasks.named('classes') {
    dependsOn 'setupRuntime'
}

// Isolated clients share the validated runtime inventory, keeping their own saves and options.
def stageIsolatedClientRuntime = { File destination ->
    project.sync {
        from 'run/kavora-runtime'
        into new File(destination, 'kavora-runtime')
    }
    project.copy {
        from('run') {
            include 'kavora-support.dll', 'kavora-support.pdb',
                    'rtx.conf', 'textures/**', 'rtx-remix/mods/minecraft-logic/**'
        }
        into destination
    }
}
def setupClientGameTestRuntimeTask = tasks.register('setupClientGameTestRuntime') {
    dependsOn 'setupRuntime'
    doLast {
        File destination = file(gameTestRunDirectory.get())
        if (destination.canonicalFile == file('run').canonicalFile)
            throw new GradleException('Client GameTests require a directory separate from run/.')
        if (gameTestFarTerrainJar.isPresent()) {
            File addon = file(gameTestFarTerrainJar.get())
            if (!addon.isFile()) throw new GradleException("Far-terrain addon does not exist: ${addon}")
            // A dedicated filename updates only this task's addon; other profile mods stay independent.
            project.copy { from addon; into new File(destination, 'mods'); rename { 'kavora-horizon-gametest.jar' } }
        }
        stageIsolatedClientRuntime(destination)
    }
}
def setupIsolatedClientRuntimeTask = tasks.register('setupIsolatedClientRuntime') {
    dependsOn 'setupRuntime'
    onlyIf { file(clientRunDirectory.get()).canonicalFile != file('run').canonicalFile }
    doLast { stageIsolatedClientRuntime(file(clientRunDirectory.get())) }
}
tasks.named('runClient') { dependsOn setupIsolatedClientRuntimeTask }
tasks.named('runClientGameTest') {
    dependsOn setupClientGameTestRuntimeTask
    timeout = java.time.Duration.ofMinutes(5)
}

// A development launcher instance loads mods as a player's install does, so it
// needs the published intermediary jar, not Loom's remapped copy. A detached,
// non-transitive configuration resolves exactly the pinned coordinate and keeps
// this task free of the native build and runtime staging.
tasks.register('stageFabricApi', Copy) {
    description = 'Copies the pinned Fabric API jar to build/dev/ for development launcher instances'
    group = 'build'
    from configurations.detachedConfiguration(dependencies.create(fabricApiCoordinate)).tap { transitive = false }
    into layout.buildDirectory.dir('dev')
    rename { 'fabric-api.jar' }
}

// SDK Java and native support are owned by their own project.
tasks.register('compileNativeWin64') { dependsOn ':kavora-sdk:compileNativeWin64' }
tasks.register('compileNativeArm64') { dependsOn ':kavora-sdk:compileNativeArm64' }

jar {
    archiveBaseName.set('Kavora')
    manifest.attributes('Implementation-Title': 'Kavora',
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'org.edtp.kavora')
    from project(':kavora-sdk').sourceSets.main.output
    from(rootProject.file('LICENSES')) { into 'META-INF/licenses/project' }
    from(project(':kavora-sdk').file('LICENSE')) { into 'META-INF/licenses/kavora-sdk' }
    from("LICENSE") {
        rename { "${it}_${projectArchiveName}" }
    }
    from("NOTICE") {
        rename { "${it}_${projectArchiveName}" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md")) {
        rename { "THIRD_PARTY_NOTICES_${projectArchiveName}.md" }
    }
}

// `build` leaves Loom's remapped lightweight JAR in build/libs for fast dev
// iteration. packageJar starts with that already-remapped JAR and adds only the
// selected native payload, writing the distributable JAR to build/distributions.
// Packaging therefore depends on an explicit task instead of guessing intent
// from Gradle's command-line task names (`package` versus `:package`).
def remapJarTask = tasks.named('jar')
def packageJarTask = tasks.register('packageJar', Zip) {
    description = 'Assembles the remapped distributable JAR with the selected platform SDKs bundled'
    group = 'build'
    dependsOn remapJarTask
    dependsOn buildArches.collect { fetchRuntimeSdkTasks[it] }
    if (buildArches.contains('win64')) dependsOn 'compileNativeWin64'
    if (buildArches.contains('arm64')) dependsOn 'compileNativeArm64'

    archiveBaseName.set('Kavora')
    archiveVersion.set(resolvedBuildVersion)
    archiveExtension.set('jar')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    from({ zipTree(remapJarTask.get().archiveFile.get().asFile) })

    // Layer the per-arch SDK and our locally-built support helper into a single
    // native/kavora-runtime-{arch}/ subtree inside the JAR. The explicit kavora-support.*
    // excludes keep a stale copy inside an SDK directory from winning over the
    // freshly-built per-arch support helper.
    if (buildArches.contains('win64')) {
        from("runtime/win64") {
            into("native/kavora-runtime-win64")
            exclude sdkExclusions
            exclude 'kavora-support.dll', 'kavora-support.pdb', 'remixbridge.dll', 'remixbridge.pdb'
        }
        from("../kavora-sdk/build/native/win64") {
            into("native/kavora-runtime-win64")
            include "kavora-support.dll", "kavora-support.pdb"
        }
    }
    if (buildArches.contains('arm64')) {
        from("runtime/arm64") {
            into("native/kavora-runtime-arm64")
            exclude sdkExclusions
            exclude 'kavora-support.dll', 'kavora-support.pdb', 'remixbridge.dll', 'remixbridge.pdb'
        }
        from("../kavora-sdk/build/native/arm64") {
            into("native/kavora-runtime-arm64")
            include "kavora-support.dll", "kavora-support.pdb"
        }
    }

    from("packaging/rtx.conf") {
        into("native")
    }
    from("packaging/rtx-remix") {
        into("native/rtx-remix")
    }
    // License texts for the redistributed runtime payload, under the same path
    // THIRD_PARTY_NOTICES.md links to. Kept outside native/ so NativeExtractor's
    // payload layout is unchanged.
    from("packaging/licenses") {
        into("packaging/licenses")
    }
    // The runtime textures the mod loads from <gameDir>/textures/.
    // NativeExtractor writes them there, so a JAR that a launcher installs on
    // its own, with no installer beside it, is complete.
    dependsOn fetchRuntimeTexturesTask
    from(runtimeTexturesDir) {
        into("native/textures")
        include runtimeTextureFiles
    }
    dependsOn verifyOwnedRuntimeTexturesTask
    from(ownedRuntimeTexturesDir) {
        into("native/textures")
        include ownedRuntimeTextureFiles
    }
}

def packageJarArchive = packageJarTask.flatMap { it.archiveFile }
def remixModsPayloadDir = file('packaging/rtx-remix')
def licensesPayloadDir = file('packaging/licenses')
def verifyPackageJarTask = tasks.register('verifyPackageJar') {
    description = 'Verifies the distributable JAR contains exactly the selected native payloads, the runtime textures, and the license texts'
    group = 'verification'
    dependsOn packageJarTask
    inputs.file(packageJarArchive)
    inputs.dir(remixModsPayloadDir)
    inputs.dir(licensesPayloadDir)

    doLast {
        def archive = packageJarArchive.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def required = ['META-INF/MANIFEST.MF', 'fabric.mod.json', 'native/rtx.conf', 'assets/kavora/icon.png']
            required.addAll(['META-INF/licenses/project/README.md',
                    'META-INF/licenses/project/Apache-2.0.txt',
                    'META-INF/licenses/project/LGPL-3.0.txt',
                    'META-INF/licenses/project/GPL-3.0.txt',
                    'META-INF/licenses/kavora-sdk/LICENSE',
                    'org/edtp/kavora/sdk/RemixAPI.class'])
            buildArches.each { arch ->
                required.add("native/kavora-runtime-${arch}/d3d9.dll")
                required.add("native/kavora-runtime-${arch}/.runtime-provenance.json")
                required.add("native/kavora-runtime-${arch}/kavora-support.dll")
                required.add("native/kavora-runtime-${arch}/kavora-support.pdb")
            }
            (runtimeTextureFiles + ownedRuntimeTextureFiles).each { name ->
                required.add("native/textures/${name}")
            }
            def payloadEntries = { File dir, String jarPrefix ->
                fileTree(dir).files.collect { payloadFile ->
                    jarPrefix + dir.toPath().relativize(payloadFile.toPath()).toString().replace('\\', '/')
                }
            }
            required.addAll(payloadEntries(remixModsPayloadDir, 'native/rtx-remix/'))
            required.addAll(payloadEntries(licensesPayloadDir, 'packaging/licenses/'))
            def missing = required.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Distributable JAR ${archive} is missing required entries: ${missing.join(', ')}")
            }

            def entryNames = zip.entries().collect { it.name }
            if (entryNames.any { it.startsWith('com/nvidia/rtxremix/') || it.startsWith('com/gbwater/rtxremix/') }) {
                throw new GradleException('Distributable JAR contains classes from the old project namespace')
            }
            if (entryNames.any { it.endsWith('/.local-sdk-source') || it.endsWith('.jar') ||
                    it.startsWith('net/fabricmc/') || it.startsWith('net/caffeinemc/') }) {
                throw new GradleException('Distributable JAR contains a local source marker or an external mod dependency')
            }
            if (entryNames.any { it.endsWith('/remixbridge.dll') || it.endsWith('/remixbridge.pdb') }) {
                throw new GradleException('Distributable JAR contains a retired JNI bridge')
            }
            if (entryNames.contains('README.md')) {
                throw new GradleException('Distributable JAR must not contain repository resource notes')
            }
            def unexpectedArches = ['win64', 'arm64'].findAll { !buildArches.contains(it) }
            unexpectedArches.each { arch ->
                def prefix = "native/kavora-runtime-${arch}/"
                if (entryNames.any { it.startsWith(prefix) }) {
                    throw new GradleException("Distributable JAR unexpectedly contains ${prefix}")
                }
            }
            // The runtime is built against OpenUSD without Python support. An
            // interpreter or the USD Python bindings in the payload would be unused
            // code that binary vulnerability scanners flag against the release.
            def pythonEntry = ~/(?i)native\/kavora-runtime-[^\/]+\/(.*\/)?([^\/]*python[^\/]*\.dll|[^\/]*\.(pyd|pyc)|python\d*(\.\d+)?\/.*)/
            def pythonOffender = entryNames.find { it ==~ pythonEntry }
            if (pythonOffender != null) {
                throw new GradleException(
                    "Distributable JAR must not contain a Python runtime: ${pythonOffender}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('package') {
    description = 'Builds a distributable JAR with the selected platform SDKs bundled'
    group = 'build'
    dependsOn 'build', verifyPackageJarTask
}

// The flat Java facade is also included in the corresponding source artifact.
tasks.named('sourcesJar') {
    from project(':kavora-sdk').sourceSets.main.allSource
    from('LICENSE', 'NOTICE')
}
